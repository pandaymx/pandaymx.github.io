server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Performance: Link optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Performance: File handle caching
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security: Consolidated headers
    include /etc/nginx/conf.d/security-headers.conf;

    # Compression: Shared Types
    set $compression_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/opentype
        font/truetype
        font/woff
        font/woff2;

    # Compression: Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types $compression_types;

    # Compression: Brotli
    brotli on;
    brotli_comp_level 11;
    brotli_static on;
    brotli_types $compression_types;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform";
        
        # Consistent headers via include (Avoids repetition and inheritance issues)
        include /etc/nginx/conf.d/security-headers.conf;
    }


    # Error handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}



