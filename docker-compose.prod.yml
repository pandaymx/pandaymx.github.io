services:
  blog-prod:
    container_name: blog-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - '8080:8080'
    restart: unless-stopped
    init: true
    # Resource limits to prevent a single container from exhausting host resources
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    # Logging optimization to prevent disk space issues
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - blog-prod-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: blog-metrics
    command:
      - -nginx.scrape-uri=http://blog-prod:8080/status
    ports:
      - '9113:9113'
    depends_on:
      - blog-prod
    networks:
      - blog-prod-net
    restart: unless-stopped

networks:
  blog-prod-net:
    driver: bridge
