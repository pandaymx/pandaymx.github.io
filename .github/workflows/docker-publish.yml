name: Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - '.dockerignore'
      - '.vscode/**'
      - '.husky/**'
      - 'docker/docker-compose*.yml'
      - '.github/workflows/!(docker-publish.yml)'

# 为了能够向 GHCR 推送镜像以及执行旧镜像清理，必需在此赋予足够的 GITHUB_TOKEN 权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 改为登录 GHCR 仓库，无需再配置复杂的 Repository Secrets 环境变量
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag variables
        id: vars
        shell: bash
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像命名空间改为 ghcr.io
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.short_sha }}

      - name: Build local image for security scan
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: localscan/${{ github.event.repository.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: localscan/${{ github.event.repository.name }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' # 发现高危漏洞则报错中断
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 利用第三方现成的、稳定的 GitHub Actions 来清理 GHCR 上的过时镜像
      - name: Prune old GHCR images
        uses: vlaurin/action-ghcr-prune@v0.5.0
        with:
          token: ${{ secrets.GH_PAT }}
          user: ${{ github.repository_owner }}
          container: ${{ github.event.repository.name }}
          keep-last: 10
          prune-tags-regexes: ^[0-9]{8}-[0-9a-f]{7}$
